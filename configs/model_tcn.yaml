# Dilated Temporal Convolutional Network (TCN) Configuration
model:
  name: "tcn"
  in_channels: 1
  num_channels: [64, 64, 64, 64, 64, 64]
  kernel_size: 5
  dropout: 0.05
  norm_type: "group"
  residual_learning: true

training:
  batch_size: 8          # RTX 3050 Laptop GPU safe
  num_workers: 0          # Windows safe
  pin_memory: true
  learning_rate: 0.0005
  weight_decay: 0.00001
  num_epochs: 15
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  mixed_precision: true
  early_stopping_patience: 5

loss:
  name: "mse"
  lambda_time: 1.0
  lambda_freq: 0.0

scheduler:
  type: "plateau"
  factor: 0.5
  patience: 2
  min_lr: 0.00001
